name: Auto Post to Sanity

on:
  # Chạy tự động 8h sáng thứ 2, 4, 6 (giờ VN = UTC+7 → 1:00 UTC)
  schedule:
    - cron: "0 1 * * 1,3,5"

  # Cho phép chạy thủ công từ GitHub UI
  workflow_dispatch:

jobs:
  auto-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate & publish blog post
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/auto-post.mjs
